name: Pytest macOS Tk PairTuple-only diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python on macOS
        id: macos-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'

      - name: Install uv on macOS
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create macOS virtual environment
        env:
          MACOS_PYTHON: ${{ steps.macos-python.outputs.python-path }}
        run: |
          uv venv --python "$MACOS_PYTHON"
          echo "UV_PYTHON=$MACOS_PYTHON" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Tcl and Tk installed versions
        run: |
          python --version
          python -c "import tkinter; print('Tcl version:', tkinter.TclVersion, 'Tk version:', tkinter.TkVersion)"

      - name: Install dependencies (without project)
        run: uv sync --no-install-project --extra dev --extra mac_dist

      - name: Install project in editable mode
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" --editable "." --no-deps

      - name: Record Python and Tcl/Tk runtime
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/amc-tk-diagnostic"
          mkdir -p "$diag"
          echo "AMC_TK_DIAG=$diag" >> "$GITHUB_ENV"
          python - <<'PY' > "$diag/runtime.txt" 2>&1
          import _tkinter
          import os
          import platform
          import subprocess
          import sys
          import tkinter as tk

          print('platform:', platform.platform(), flush=True)
          print('python:', sys.version, flush=True)
          print('executable:', sys.executable, flush=True)
          print('real executable:', os.path.realpath(sys.executable), flush=True)
          print('_tkinter:', _tkinter.__file__, flush=True)
          root = tk.Tk()
          print('Tcl patchlevel:', root.tk.call('info', 'patchlevel'), flush=True)
          print('Tk patchlevel:', root.tk.call('package', 'require', 'Tk'), flush=True)
          print('otool -L _tkinter:', flush=True)
          subprocess.run(['/usr/bin/otool', '-L', _tkinter.__file__], check=False)
          print('loaded Tcl/Tk libraries (lsof):', flush=True)
          result = subprocess.run(['/usr/sbin/lsof', '-p', str(os.getpid())], capture_output=True, text=True, check=False)
          for line in result.stdout.splitlines():
              if '_tkinter' in line or 'libtcl' in line or 'libtk' in line or 'Tcl.framework' in line or 'Tk.framework' in line:
                  print(line, flush=True)
          root.destroy()
          PY

      - name: Run PairTuple-only trial with conditional control
        shell: bash
        run: |
          set -euo pipefail
          diag="$AMC_TK_DIAG"
          cat > "$RUNNER_TEMP/amc_tk_order_probe.py" <<'PY_PLUGIN'
          """Temporary pytest selection and phase trace; does not patch Tk."""

          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          import pytest

          PAIR = "tests/test_frontend_tkinter_pair_tuple_combobox.py::"
          APPLICATION = "tests/test_frontend_tkinter_parameter_application.py::"
          COMPARE = "tests/test_frontend_tkinter_parameter_compare_and_upload.py::"
          EDITOR = "tests/test_frontend_tkinter_parameter_editor.py::"
          UI = EDITOR + "TestParameterEditorUiServices::"
          TARGET = EDITOR + "TestWindowSizing::test_user_can_close_editor_with_resize_queued[main-frame]"
          COUNTS = {PAIR: 46, APPLICATION: 16, COMPARE: 33, UI: 1, TARGET: 1}
          GROUPS = {
              "D": (PAIR, TARGET),
              "A": (PAIR, COMPARE, UI, TARGET),
          }
          EXPECTED = {"D": (47, "0d3a8cc22d570c0312d7e78492b28c004dfd2c737e1eefd7167bbc404def36d3"),
                      "A": (81, "78f9d6ce2dabd3ccef0e9ea580138329f575479a2e7aa86d5b51bb905872163e")}
          DIAG = Path(os.environ["AMC_TK_DIAG"])
          TRIAL = os.environ["AMC_TK_TRIAL"]
          START = time.monotonic_ns()
          FD = None
          selected = set()
          current = None
          phase = "initial"


          def matches(nodeid, group):
              return nodeid == TARGET if group == TARGET else nodeid.startswith(group)


          def selection(items):
              ids = [item.nodeid for item in items]
              indices = {group: [i for i, value in enumerate(ids) if matches(value, group)]
                         for group in COUNTS}
              if any(len(indices[group]) != count for group, count in COUNTS.items()):
                  raise pytest.UsageError("GUI module counts or target node ID changed")
              groups = tuple(COUNTS)
              if not all(max(indices[left]) < min(indices[right])
                         for left, right in zip(groups, groups[1:])):
                  raise pytest.UsageError("original GUI module order changed")
              first, last = indices[PAIR][0], indices[TARGET][0]
              if len(ids[first:last + 1]) != 97 or any(
                      not any(matches(value, group) for group in groups)
                      for value in ids[first:last + 1]):
                  raise pytest.UsageError("unexpected tests between PairTupleCombobox and target")
              result = {}
              for name, included in GROUPS.items():
                  chosen = [item for item in items if any(matches(item.nodeid, group)
                                                            for group in included)]
                  chosen_ids = [item.nodeid for item in chosen]
                  text = "\n".join(chosen_ids) + "\n"
                  digest = hashlib.sha256(text.encode()).hexdigest()
                  if (len(chosen_ids), digest) != EXPECTED[name]:
                      raise pytest.UsageError(f"trial {name} IDs, count or order changed")
                  (DIAG / f"{name}-selected-test-ids.txt").write_text(text)
                  result[name] = {"count": len(chosen_ids),
                                  "sha256": digest,
                                  "first": chosen_ids[0], "last": chosen_ids[-1]}
              return result


          @pytest.hookimpl(trylast=True)
          def pytest_collection_modifyitems(config, items):
              global FD
              manifest = selection(items)
              path = DIAG / "selection-manifest.json"
              if TRIAL == "D":
                  path.write_text(json.dumps(manifest, indent=2) + "\n")
              elif TRIAL != "A" or json.loads(path.read_text()) != manifest:
                  raise pytest.UsageError("trial selection differs from preflight manifest")
              chosen = [item for item in items if any(matches(item.nodeid, group)
                                                        for group in GROUPS[TRIAL])]
              selected.update(item.nodeid for item in chosen)
              excluded = [item for item in items if item.nodeid not in selected]
              config.hook.pytest_deselected(items=excluded)
              items[:] = chosen
              FD = os.open(DIAG / f"{TRIAL}-phase-trace.jsonl",
                           os.O_CREAT | os.O_TRUNC | os.O_WRONLY, 0o600)


          def record(event, **details):
              if FD is None:
                  return
              row = {"ms": round((time.monotonic_ns() - START) / 1_000_000, 3),
                     "event": event, "nodeid": current, "phase": phase, **details}
              os.write(FD, (json.dumps(row, separators=(",", ":")) + "\n").encode())


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_runtest_protocol(item, nextitem):
              global current, phase
              if item.nodeid not in selected:
                  yield
                  return
              current, phase = item.nodeid, "protocol"
              record("test_start")
              yield
              record("test_end")
              current = None


          def phase_hook(name):
              @pytest.hookimpl(hookwrapper=True, tryfirst=True)
              def hook(item):
                  global phase
                  if item.nodeid not in selected:
                      yield
                      return
                  phase = name
                  start = time.monotonic_ns()
                  record("phase_start")
                  outcome = yield
                  record("phase_end",
                         ms_elapsed=round((time.monotonic_ns() - start) / 1_000_000, 3),
                         outcome=(outcome.excinfo[0].__name__ if outcome.excinfo else "ok"))
              return hook


          pytest_runtest_setup = phase_hook("setup")
          pytest_runtest_call = phase_hook("call")
          pytest_runtest_teardown = phase_hook("teardown")
          PY_PLUGIN
          export PYTHONPATH="$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONFAULTHANDLER=1
          export PYTHONUNBUFFERED=1
          run_trial() {
            trial="$1"
            export AMC_TK_TRIAL="$trial"
            set +e
            "$VIRTUAL_ENV/bin/python" -X faulthandler -m pytest -p amc_tk_order_probe \
              --timeout=30 --timeout-method=thread \
              -o "cache_dir=$RUNNER_TEMP/amc-tk-pytest-cache" -vv 2>&1 \
              | tee "$diag/$trial-pytest.log"
            trial_status=${PIPESTATUS[0]}
            set -e
            printf 'pytest exit: %s\n' "$trial_status" > "$diag/$trial-exit.txt"
            printf 'Trial %s pytest exit: %s\n' "$trial" "$trial_status"
          }
          run_trial D
          if [ "$trial_status" -eq 0 ]; then
            run_trial A
          else
            printf 'Trial A skipped because Trial D exited %s\n' "$trial_status" > "$diag/A-skipped.txt"
          fi

      - name: Upload Tk diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-python315-tk-pairtuple-only
          path: ${{ runner.temp }}/amc-tk-diagnostic/
          if-no-files-found: warn
          retention-days: 3
