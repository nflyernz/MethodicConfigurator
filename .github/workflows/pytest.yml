name: Pytest macOS Tk original-order prefix diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python on macOS
        id: macos-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'

      - name: Install uv on macOS
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create macOS virtual environment
        env:
          MACOS_PYTHON: ${{ steps.macos-python.outputs.python-path }}
        run: |
          uv venv --python "$MACOS_PYTHON"
          echo "UV_PYTHON=$MACOS_PYTHON" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Tcl and Tk installed versions
        run: |
          python --version
          python -c "import tkinter; print('Tcl version:', tkinter.TclVersion, 'Tk version:', tkinter.TkVersion)"

      - name: Install dependencies (without project)
        run: uv sync --no-install-project --extra dev --extra mac_dist

      - name: Install project in editable mode
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" --editable "." --no-deps

      - name: Record Python and Tcl/Tk runtime
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/amc-tk-diagnostic"
          mkdir -p "$diag"
          echo "AMC_TK_DIAG=$diag" >> "$GITHUB_ENV"
          python - <<'PY' > "$diag/runtime.txt" 2>&1
          import _tkinter
          import os
          import platform
          import subprocess
          import sys
          import tkinter as tk

          print('platform:', platform.platform(), flush=True)
          print('python:', sys.version, flush=True)
          print('executable:', sys.executable, flush=True)
          print('real executable:', os.path.realpath(sys.executable), flush=True)
          print('_tkinter:', _tkinter.__file__, flush=True)
          root = tk.Tk()
          print('Tcl patchlevel:', root.tk.call('info', 'patchlevel'), flush=True)
          print('Tk patchlevel:', root.tk.call('package', 'require', 'Tk'), flush=True)
          print('otool -L _tkinter:', flush=True)
          subprocess.run(['/usr/bin/otool', '-L', _tkinter.__file__], check=False)
          print('loaded Tcl/Tk libraries (lsof):', flush=True)
          result = subprocess.run(['/usr/sbin/lsof', '-p', str(os.getpid())], capture_output=True, text=True, check=False)
          for line in result.stdout.splitlines():
              if '_tkinter' in line or 'libtcl' in line or 'libtk' in line or 'Tcl.framework' in line or 'Tk.framework' in line:
                  print(line, flush=True)
          root.destroy()
          PY

      - name: Run two remaining original-order prefix trials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          diag="$AMC_TK_DIAG"
          cat > "$RUNNER_TEMP/amc_prefix_plugin.py" <<'PY_PLUGIN'
          import os
          from pathlib import Path

          import pytest

          output = Path(os.environ['AMC_TK_DIAG'])
          run = os.environ['AMC_PREFIX_RUN']
          target = (
              'tests/gui_frontend_tkinter_parameter_editor.py::'
              'TestParameterEditorWindow::test_show_about_window'
          )

          @pytest.hookimpl(trylast=True)
          def pytest_collection_finish(session):
              all_ids = [item.nodeid for item in session.items]
              (output / f'run-{run}-collected.txt').write_text(
                  '\n'.join(all_ids) + '\n', encoding='utf-8'
              )
              matches = [index for index, nodeid in enumerate(all_ids) if nodeid == target]
              if len(matches) != 1:
                  raise pytest.UsageError(f'Expected one target case; found {len(matches)}')
              if matches[0] >= 1000:
                  raise pytest.UsageError(f'Target moved beyond bounded prefix: index {matches[0]}')
              prefix = all_ids[:matches[0] + 1]
              (output / f'run-{run}-prefix.txt').write_text(
                  '\n'.join(prefix) + '\n', encoding='utf-8'
              )
              (output / f'run-{run}-counts.txt').write_text(
                  f'collected: {len(all_ids)}\nprefix: {len(prefix)}\n', encoding='utf-8'
              )
              session.items[:] = session.items[:matches[0] + 1]

          def pytest_runtest_logstart(nodeid, location):
              with (output / f'run-{run}-started.txt').open('a', encoding='utf-8') as stream:
                  stream.write(nodeid + '\n')

          def pytest_runtest_logreport(report):
              with (output / f'run-{run}-results.txt').open('a', encoding='utf-8') as stream:
                  stream.write(f'{report.nodeid}\t{report.when}\t{report.outcome}\n')
          PY_PLUGIN
          export PYTHONPATH="$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}"
          overall=0
          for run in 2 3; do
            echo "::group::original-order prefix run $run"
            set +e
            AMC_PREFIX_RUN="$run" PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 uv run pytest \
              -p amc_prefix_plugin \
              --cov=ardupilot_methodic_configurator \
              --cov-report="xml:$RUNNER_TEMP/amc-prefix-$run-coverage.xml" \
              --md="$RUNNER_TEMP/amc-prefix-$run-results.md" \
              --junit-xml="$RUNNER_TEMP/amc-prefix-$run-junit.xml" \
              -m "not sitl" 2>&1 | tee "$RUNNER_TEMP/amc-prefix-$run-raw.log"
            status=${PIPESTATUS[0]}
            set -e
            printf 'pytest exit: %s\n' "$status" > "$diag/run-$run-exit.txt"
            AMC_PREFIX_RUN="$run" python - <<'PY_REDACT'
          import os
          from pathlib import Path

          run = os.environ['AMC_PREFIX_RUN']
          raw = Path(os.environ['RUNNER_TEMP']) / f'amc-prefix-{run}-raw.log'
          log = raw.read_text(encoding='utf-8', errors='replace')
          token = os.environ.get('GITHUB_TOKEN', '')
          if token:
              log = log.replace(token, '[REDACTED]')
          (Path(os.environ['AMC_TK_DIAG']) / f'run-{run}-pytest.log').write_text(log, encoding='utf-8')
          raw.unlink()
          PY_REDACT
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              overall=1
            fi
          done
          exit "$overall"

      - name: Upload Tk diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-python315-tk-original-order-prefix
          path: ${{ runner.temp }}/amc-tk-diagnostic/
          if-no-files-found: warn
          retention-days: 3
