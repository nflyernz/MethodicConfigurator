name: Pytest macOS Tk diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python on macOS
        id: macos-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'

      - name: Install uv on macOS
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create macOS virtual environment
        env:
          MACOS_PYTHON: ${{ steps.macos-python.outputs.python-path }}
        run: |
          uv venv --python "$MACOS_PYTHON"
          echo "UV_PYTHON=$MACOS_PYTHON" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Tcl and Tk installed versions
        run: |
          python --version
          python -c "import tkinter; print('Tcl version:', tkinter.TclVersion, 'Tk version:', tkinter.TkVersion)"

      - name: Install dependencies (without project)
        run: uv sync --no-install-project --extra dev --extra mac_dist

      - name: Install project in editable mode
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" --editable "." --no-deps

      - name: Record runtime and verify native sampling
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/amc-tk-diagnostic"
          mkdir -p "$diag"
          echo "AMC_TK_DIAG=$diag" >> "$GITHUB_ENV"
          command -v sample > "$diag/sample-path.txt"
          python - <<'PY' > "$diag/runtime.txt" 2>&1
          import _tkinter
          import os
          import platform
          import subprocess
          import sys
          import tkinter as tk

          print('platform:', platform.platform(), flush=True)
          print('python:', sys.version, flush=True)
          print('executable:', sys.executable, flush=True)
          print('real executable:', os.path.realpath(sys.executable), flush=True)
          print('_tkinter:', _tkinter.__file__, flush=True)
          root = tk.Tk()
          print('Tcl patchlevel:', root.tk.call('info', 'patchlevel'), flush=True)
          print('Tk patchlevel:', root.tk.call('package', 'require', 'Tk'), flush=True)
          print('otool -L _tkinter:', flush=True)
          subprocess.run(['/usr/bin/otool', '-L', _tkinter.__file__], check=False)
          print('loaded Tcl/Tk libraries (lsof):', flush=True)
          result = subprocess.run(['/usr/sbin/lsof', '-p', str(os.getpid())], capture_output=True, text=True, check=False)
          for line in result.stdout.splitlines():
              if '_tkinter' in line or 'libtcl' in line or 'libtk' in line or 'Tcl.framework' in line or 'Tk.framework' in line:
                  print(line, flush=True)
          root.destroy()
          PY
          python -c 'import time; time.sleep(8)' &
          probe_pid=$!
          set +e
          sample "$probe_pid" 1 -file "$diag/sample-probe.txt" > "$diag/sample-probe-output.txt" 2>&1
          probe_status=$?
          set -e
          kill "$probe_pid" 2>/dev/null || true
          wait "$probe_pid" 2>/dev/null || true
          echo "probe exit: $probe_status" >> "$diag/sample-probe-output.txt"
          test "$probe_status" -eq 0
          test -s "$diag/sample-probe.txt"

      - name: Run full pytest selection with independent watchdog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          diag="$AMC_TK_DIAG"
          cat > "$RUNNER_TEMP/amc_diag_plugin.py" <<'PY'
          import json
          import os
          import pathlib
          import time

          state = pathlib.Path(os.environ['AMC_TK_DIAG']) / 'current-test.json'
          started = 0.0

          def record(test, phase):
              payload = {'pid': os.getpid(), 'test': test, 'phase': phase,
                         'started_monotonic': started, 'phase_started_monotonic': time.monotonic(),
                         'recorded_epoch': time.time()}
              temporary = state.with_suffix('.tmp')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              os.replace(temporary, state)

          import pytest

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_protocol(item, nextitem):
              global started
              started = time.monotonic()
              record(item.nodeid, 'protocol')
              yield
              record('', 'idle')

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_setup(item):
              record(item.nodeid, 'setup')
              yield

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_call(item):
              record(item.nodeid, 'call')
              yield

          @pytest.hookimpl(hookwrapper=True)
          def pytest_runtest_teardown(item, nextitem):
              record(item.nodeid, 'teardown')
              yield

          def pytest_sessionfinish(session, exitstatus):
              record('', 'finished')
          PY
          cat > "$RUNNER_TEMP/amc_watchdog.py" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time

          output = pathlib.Path(os.environ['AMC_TK_DIAG'])
          state = output / 'current-test.json'
          sampled_phases = set()
          sample_count = 0
          while True:
              try:
                  current = json.loads(state.read_text(encoding='utf-8'))
              except (FileNotFoundError, json.JSONDecodeError):
                  time.sleep(0.25)
                  continue
              if current['phase'] == 'finished':
                  break
              pid = current['pid']
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  break
              elapsed = time.monotonic() - current['phase_started_monotonic']
              key = (current['test'], current['phase'])
              if (sample_count < 5 and key not in sampled_phases and
                      'TestWindowSizing' in current['test'] and elapsed >= 20):
                  sampled_phases.add(key)
                  sample_count += 1
                  suffix = str(sample_count)
                  (output / f'trigger-{suffix}.json').write_text(
                      json.dumps({**current, 'phase_elapsed_seconds': elapsed}, indent=2), encoding='utf-8')
                  try:
                      result = subprocess.run(
                          ['/usr/bin/sample', str(pid), '5', '-file', str(output / f'pytest-native-sample-{suffix}.txt')],
                          capture_output=True, text=True, timeout=9, check=False)
                      (output / f'sample-result-{suffix}.txt').write_text(
                          f'exit: {result.returncode}\n{result.stdout}\n{result.stderr}', encoding='utf-8')
                  except subprocess.TimeoutExpired as error:
                      (output / f'sample-result-{suffix}.txt').write_text(f'sample timed out: {error}', encoding='utf-8')
              time.sleep(0.25)
          PY
          export PYTHONPATH="$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}"
          python "$RUNNER_TEMP/amc_watchdog.py" > "$diag/watchdog.log" 2>&1 &
          watchdog_pid=$!
          set +e
          PYTHONUNBUFFERED=1 uv run pytest -p amc_diag_plugin --cov=ardupilot_methodic_configurator --cov-report=xml:tests/coverage.xml --md=tests/results-3.15.2.md --junit-xml=tests/results-junit.xml -m "not sitl" 2>&1 | tee "$RUNNER_TEMP/amc-pytest-raw.log"
          test_status=${PIPESTATUS[0]}
          set -e
          echo "pytest exit: $test_status" > "$diag/pytest-exit.txt"
          # The token is available to tests as in normal CI; redact it before artifact upload.
          python - <<'PY'
          import os
          import pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'amc-pytest-raw.log'
          text = path.read_text(encoding='utf-8', errors='replace')
          token = os.environ.get('GITHUB_TOKEN', '')
          if token:
              text = text.replace(token, '[REDACTED]')
          (pathlib.Path(os.environ['AMC_TK_DIAG']) / 'pytest.log').write_text(text, encoding='utf-8')
          path.unlink()
          PY
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" || true
          exit "$test_status"

      - name: Upload Tk diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-python315-tk-native-diagnostic
          path: ${{ runner.temp }}/amc-tk-diagnostic/
          if-no-files-found: warn
          retention-days: 3
