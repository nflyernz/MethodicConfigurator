name: Pytest macOS Tk initialization control diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python on macOS
        id: macos-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'

      - name: Install uv on macOS
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create macOS virtual environment
        env:
          MACOS_PYTHON: ${{ steps.macos-python.outputs.python-path }}
        run: |
          uv venv --python "$MACOS_PYTHON"
          echo "UV_PYTHON=$MACOS_PYTHON" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Tcl and Tk installed versions
        run: |
          python --version
          python -c "import tkinter; print('Tcl version:', tkinter.TclVersion, 'Tk version:', tkinter.TkVersion)"

      - name: Install dependencies (without project)
        run: uv sync --no-install-project --extra dev --extra mac_dist

      - name: Install project in editable mode
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" --editable "." --no-deps

      - name: Record Python and Tcl/Tk runtime
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/amc-tk-diagnostic"
          mkdir -p "$diag"
          echo "AMC_TK_DIAG=$diag" >> "$GITHUB_ENV"
          python - <<'PY' > "$diag/runtime.txt" 2>&1
          import _tkinter
          import os
          import platform
          import subprocess
          import sys
          import tkinter as tk

          print('platform:', platform.platform(), flush=True)
          print('python:', sys.version, flush=True)
          print('executable:', sys.executable, flush=True)
          print('real executable:', os.path.realpath(sys.executable), flush=True)
          print('_tkinter:', _tkinter.__file__, flush=True)
          root = tk.Tk()
          print('Tcl patchlevel:', root.tk.call('info', 'patchlevel'), flush=True)
          print('Tk patchlevel:', root.tk.call('package', 'require', 'Tk'), flush=True)
          print('otool -L _tkinter:', flush=True)
          subprocess.run(['/usr/bin/otool', '-L', _tkinter.__file__], check=False)
          print('loaded Tcl/Tk libraries (lsof):', flush=True)
          result = subprocess.run(['/usr/sbin/lsof', '-p', str(os.getpid())], capture_output=True, text=True, check=False)
          for line in result.stdout.splitlines():
              if '_tkinter' in line or 'libtcl' in line or 'libtk' in line or 'Tcl.framework' in line or 'Tk.framework' in line:
                  print(line, flush=True)
          root.destroy()
          PY

      - name: Run Trial P initialization control
        shell: bash
        run: |
          set -euo pipefail
          diag="$AMC_TK_DIAG"
          cat > "$RUNNER_TEMP/amc_tk_order_probe.py" <<'PY_PLUGIN'
          """Temporary pytest selection and phase trace; does not patch Tk."""

          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          import pytest

          PAIR = "tests/test_frontend_tkinter_pair_tuple_combobox.py::"
          INITIALIZATION = PAIR + "TestPairTupleComboboxTooltip::test_initialization"
          TARGET = ("tests/test_frontend_tkinter_parameter_editor.py::TestWindowSizing::"
                    "test_user_can_close_editor_with_resize_queued[main-frame]")
          PARENT_SHA256 = "abc7601b8520717c1cc1f1a59f579499ef518806e42018a8d89868b659463132"
          EXPECTED_COUNT = 2
          EXPECTED_SHA256 = "81dd7b605919868ea40201c81035dd4c4acbba31c27095c8c706a2c0e664bd22"
          DIAG = Path(os.environ["AMC_TK_DIAG"])
          START = time.monotonic_ns()
          FD = None
          selected = set()
          current = None
          phase = "initial"


          def selection(items):
              ids = [item.nodeid for item in items]
              pair = [item for item in items if item.nodeid.startswith(PAIR)]
              target = [item for item in items if item.nodeid == TARGET]
              if (len(pair) != 46 or len(target) != 1
                      or max(ids.index(item.nodeid) for item in pair) >= ids.index(TARGET)):
                  raise pytest.UsageError("validated PairTupleCombobox order or target changed")
              parent = pair[:11] + target
              parent_text = "\n".join(item.nodeid for item in parent) + "\n"
              if hashlib.sha256(parent_text.encode()).hexdigest() != PARENT_SHA256:
                  raise pytest.UsageError("Trial H predecessor IDs or order changed")
              if pair[5].nodeid != INITIALIZATION:
                  raise pytest.UsageError("initialization test moved in collection")
              chosen = [pair[5]] + target
              chosen_ids = [item.nodeid for item in chosen]
              text = "\n".join(chosen_ids) + "\n"
              digest = hashlib.sha256(text.encode()).hexdigest()
              if (len(chosen_ids), digest) != (EXPECTED_COUNT, EXPECTED_SHA256):
                  raise pytest.UsageError("Trial P IDs, count or order changed")
              if chosen_ids != [INITIALIZATION, TARGET]:
                  raise pytest.UsageError("Trial P selected unexpected test IDs")
              (DIAG / "P-selected-test-ids.txt").write_text(text)
              manifest = {"count": len(chosen_ids), "sha256": digest,
                          "first": chosen_ids[0], "last": chosen_ids[-1]}
              (DIAG / "P-selection-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
              return chosen


          @pytest.hookimpl(trylast=True)
          def pytest_collection_modifyitems(config, items):
              global FD
              chosen = selection(items)
              selected.update(item.nodeid for item in chosen)
              excluded = [item for item in items if item.nodeid not in selected]
              config.hook.pytest_deselected(items=excluded)
              items[:] = chosen
              FD = os.open(DIAG / "P-phase-trace.jsonl",
                           os.O_CREAT | os.O_TRUNC | os.O_WRONLY, 0o600)


          def record(event, **details):
              if FD is None:
                  return
              row = {"ms": round((time.monotonic_ns() - START) / 1_000_000, 3),
                     "event": event, "nodeid": current, "phase": phase, **details}
              os.write(FD, (json.dumps(row, separators=(",", ":")) + "\n").encode())


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_runtest_protocol(item, nextitem):
              global current, phase
              if item.nodeid not in selected:
                  yield
                  return
              current, phase = item.nodeid, "protocol"
              record("test_start")
              yield
              record("test_end")
              current = None


          def phase_hook(name):
              @pytest.hookimpl(hookwrapper=True, tryfirst=True)
              def hook(item):
                  global phase
                  if item.nodeid not in selected:
                      yield
                      return
                  phase = name
                  start = time.monotonic_ns()
                  record("phase_start")
                  outcome = yield
                  record("phase_end",
                         ms_elapsed=round((time.monotonic_ns() - start) / 1_000_000, 3),
                         outcome=(outcome.excinfo[0].__name__ if outcome.excinfo else "ok"))
              return hook


          pytest_runtest_setup = phase_hook("setup")
          pytest_runtest_call = phase_hook("call")
          pytest_runtest_teardown = phase_hook("teardown")
          PY_PLUGIN
          export PYTHONPATH="$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONFAULTHANDLER=1
          export PYTHONUNBUFFERED=1
          check_checkout() {
            label="$1"
            git status --short > "$diag/$label-status.txt"
            git diff HEAD -- > "$diag/$label-tracked.diff"
            test ! -s "$diag/$label-tracked.diff"
            python - "$diag/$label-untracked.txt" <<'PY_CHECK'
          import subprocess
          import sys
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]
          ).decode().rstrip("\0").split("\0")
          paths = [path for path in paths if path]
          Path(sys.argv[1]).write_text("\n".join(paths) + ("\n" if paths else ""))
          unexpected = set(paths) - {"uv.lock"}
          if unexpected:
              raise SystemExit(f"unexpected untracked paths: {sorted(unexpected)}")
          PY_CHECK
          }
          check_checkout before
          set +e
          "$VIRTUAL_ENV/bin/python" -X faulthandler -m pytest -p amc_tk_order_probe \
            --timeout=30 --timeout-method=thread \
            -o "cache_dir=$RUNNER_TEMP/amc-tk-pytest-cache" -vv 2>&1 \
            | tee "$diag/P-pytest.log"
          trial_status=${PIPESTATUS[0]}
          set -e
          printf 'pytest exit: %s\n' "$trial_status" > "$diag/P-exit.txt"
          printf 'Trial P pytest exit: %s\n' "$trial_status"
          check_checkout after

      - name: Upload Tk diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-python315-tk-trial-p-initialization
          path: ${{ runner.temp }}/amc-tk-diagnostic/
          if-no-files-found: warn
          retention-days: 3
