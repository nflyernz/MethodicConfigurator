name: Pytest macOS Tk original-order GUI geometry diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python on macOS
        id: macos-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'

      - name: Install uv on macOS
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create macOS virtual environment
        env:
          MACOS_PYTHON: ${{ steps.macos-python.outputs.python-path }}
        run: |
          uv venv --python "$MACOS_PYTHON"
          echo "UV_PYTHON=$MACOS_PYTHON" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Tcl and Tk installed versions
        run: |
          python --version
          python -c "import tkinter; print('Tcl version:', tkinter.TclVersion, 'Tk version:', tkinter.TkVersion)"

      - name: Install dependencies (without project)
        run: uv sync --no-install-project --extra dev --extra mac_dist

      - name: Install project in editable mode
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" --editable "." --no-deps

      - name: Record Python and Tcl/Tk runtime
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/amc-tk-diagnostic"
          mkdir -p "$diag"
          echo "AMC_TK_DIAG=$diag" >> "$GITHUB_ENV"
          python - <<'PY' > "$diag/runtime.txt" 2>&1
          import _tkinter
          import os
          import platform
          import subprocess
          import sys
          import tkinter as tk

          print('platform:', platform.platform(), flush=True)
          print('python:', sys.version, flush=True)
          print('executable:', sys.executable, flush=True)
          print('real executable:', os.path.realpath(sys.executable), flush=True)
          print('_tkinter:', _tkinter.__file__, flush=True)
          root = tk.Tk()
          print('Tcl patchlevel:', root.tk.call('info', 'patchlevel'), flush=True)
          print('Tk patchlevel:', root.tk.call('package', 'require', 'Tk'), flush=True)
          print('otool -L _tkinter:', flush=True)
          subprocess.run(['/usr/bin/otool', '-L', _tkinter.__file__], check=False)
          print('loaded Tcl/Tk libraries (lsof):', flush=True)
          result = subprocess.run(['/usr/sbin/lsof', '-p', str(os.getpid())], capture_output=True, text=True, check=False)
          for line in result.stdout.splitlines():
              if '_tkinter' in line or 'libtcl' in line or 'libtk' in line or 'Tcl.framework' in line or 'Tk.framework' in line:
                  print(line, flush=True)
          root.destroy()
          PY

      - name: Run instrumented original-order GUI sequence
        shell: bash
        run: |
          set -euo pipefail
          diag="$AMC_TK_DIAG"
          cat > "$RUNNER_TEMP/amc_tk_geometry_probe.py" <<'PY_PLUGIN'
          """Temporary, bounded Tk geometry trace for ordered AMC GUI tests."""

          import functools
          import hashlib
          import json
          import os
          import time
          import tkinter as tk
          from pathlib import Path

          import pytest

          from ardupilot_methodic_configurator.frontend_tkinter_parameter_editor import ParameterEditorWindow


          FIRST_MODULE = "tests/test_frontend_tkinter_parameter_compare_and_upload.py::"
          EDITOR_MODULE = "tests/test_frontend_tkinter_parameter_editor.py::"
          UI_PREFIX = EDITOR_MODULE + "TestParameterEditorUiServices::"
          SIZING_PREFIX = EDITOR_MODULE + "TestWindowSizing::"
          EXPECTED_SHA256 = "77e0bd7ab82932c21870cf0ba840043c59ff43f2c733aa341d2e3f911f2f1842"
          selected_ids = set()
          FD = os.open(os.environ["AMC_TK_GEOMETRY_TRACE"], os.O_CREAT | os.O_TRUNC | os.O_WRONLY, 0o600)
          START = time.monotonic_ns()
          LIMIT = 40000
          count = 0
          omitted = 0
          phase = "initial"
          nodeid = None
          bindings_exist = False
          editor_seen = None
          root_seen = None
          originals = {}
          resize_jobs = set()


          @pytest.hookimpl(trylast=True)
          def pytest_collection_modifyitems(config, items):
              ids = [item.nodeid for item in items]
              start = next(i for i, value in enumerate(ids) if value.startswith(FIRST_MODULE))
              end = max(i for i, value in enumerate(ids) if value.startswith(SIZING_PREFIX))
              chosen = items[start:end + 1]
              chosen_ids = [item.nodeid for item in chosen]
              text = "\n".join(chosen_ids) + "\n"
              Path(os.environ["AMC_TK_SELECTED_IDS"]).write_text(text)
              valid = (len(chosen) == 106
                       and sum(value.startswith(FIRST_MODULE) for value in chosen_ids) == 33
                       and sum(value.startswith(UI_PREFIX) for value in chosen_ids) == 1
                       and sum(value.startswith(SIZING_PREFIX) for value in chosen_ids) == 72
                       and all(value.startswith((FIRST_MODULE, UI_PREFIX, SIZING_PREFIX)) for value in chosen_ids)
                       and hashlib.sha256(text.encode()).hexdigest() == EXPECTED_SHA256)
              if not valid:
                  raise pytest.UsageError("original-order GUI selection differs from the validated 106-test sequence")
              selected_ids.update(chosen_ids)
              config.hook.pytest_deselected(items=items[:start] + items[end + 1:])
              items[:] = chosen


          def record(event, **details):
              global count, omitted
              if count >= LIMIT:
                  omitted += 1
                  return
              row = {"ms": round((time.monotonic_ns() - START) / 1_000_000, 3),
                     "event": event, "phase": phase, "nodeid": nodeid,
                     "bindings_exist": bindings_exist, **details}
              os.write(FD, (json.dumps(row, default=str, separators=(",", ":")) + "\n").encode())
              count += 1


          def geometry(editor):
              def value(widget, method, *args):
                  try:
                      return getattr(widget, method)(*args)
                  except (AttributeError, tk.TclError):
                      return None

              area = getattr(editor, "parameter_area_container", None)
              scroll = getattr(editor, "inline_component_scroll_frame", None)
              canvas = getattr(scroll, "canvas", None)
              panel = getattr(editor, "inline_component_container", None)
              return {"area_cfg": value(area, "cget", "height"),
                      "area_actual": value(area, "winfo_height"),
                      "canvas_cfg": value(canvas, "cget", "height"),
                      "canvas_actual": value(canvas, "winfo_height"),
                      "panel_cfg": value(panel, "cget", "height"),
                      "panel_actual": value(panel, "winfo_height"),
                      "viewport_req": value(getattr(scroll, "view_port", None), "winfo_reqheight"),
                      "job": getattr(editor, "_parameter_area_resize_job", None)}


          def pending(where):
              jobs = None
              if root_seen is not None:
                  try:
                      jobs = root_seen.tk.call("after", "info")
                  except tk.TclError:
                      pass
              record("pending", where=where,
                     resize_job=getattr(editor_seen, "_parameter_area_resize_job", None),
                     tracked_jobs=sorted(resize_jobs), after_jobs=jobs, omitted=omitted)


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_runtest_protocol(item, nextitem):
              global phase, nodeid, bindings_exist, editor_seen, root_seen
              if item.nodeid not in selected_ids:
                  yield
                  return
              phase = "protocol"
              nodeid = item.nodeid
              bindings_exist = False
              editor_seen = None
              root_seen = None
              resize_jobs.clear()
              record("test_start")

              def wrap(cls, name, factory):
                  original = getattr(cls, name)
                  originals[(cls, name)] = original
                  setattr(cls, name, factory(original))

              def update_factory(original):
                  @functools.wraps(original)
                  def traced(self):
                      global root_seen
                      if isinstance(self, tk.Tk):
                          root_seen = self
                      start = time.monotonic_ns()
                      record("update_enter", widget=str(self))
                      try:
                          return original(self)
                      finally:
                          record("update_exit", widget=str(self),
                                 ms_elapsed=round((time.monotonic_ns() - start) / 1_000_000, 3))
                  return traced

              def after_idle_factory(original):
                  @functools.wraps(original)
                  def traced(self, func, *args):
                      relevant = getattr(func, "__name__", "") == "_run_pending_parameter_area_resize"
                      if relevant:
                          record("after_idle_schedule", widget=str(self))
                      job = None

                      @functools.wraps(func)
                      def called(*call_args):
                          if relevant:
                              resize_jobs.discard(job)
                              record("after_idle_execute", widget=str(self), job=job)
                          return func(*call_args)

                      job = original(self, called, *args)
                      if relevant:
                          resize_jobs.add(job)
                          record("after_idle_job", job=job)
                      return job
                  return traced

              def after_cancel_factory(original):
                  @functools.wraps(original)
                  def traced(self, job):
                      if job in resize_jobs:
                          resize_jobs.discard(job)
                          record("after_idle_cancel", job=job, widget=str(self))
                      return original(self, job)
                  return traced

              def bind_factory(original):
                  @functools.wraps(original)
                  def traced(self, *args, **kwargs):
                      global bindings_exist, editor_seen
                      editor_seen = self
                      result = original(self, *args, **kwargs)
                      bindings_exist = True
                      record("bindings_ready")
                      return result
                  return traced

              def resize_event_factory(original):
                  @functools.wraps(original)
                  def traced(self, event):
                      record("configure_callback", widget=str(getattr(event, "widget", "?")),
                             job=self._parameter_area_resize_job,
                             running=self._parameter_area_resize_running)
                      return original(self, event)
                  return traced

              def pending_factory(original):
                  @functools.wraps(original)
                  def traced(self):
                      record("pending_fit_enter", job=self._parameter_area_resize_job)
                      start = time.monotonic_ns()
                      try:
                          return original(self)
                      finally:
                          record("pending_fit_exit",
                                 ms_elapsed=round((time.monotonic_ns() - start) / 1_000_000, 3))
                  return traced

              def fit_factory(original):
                  @functools.wraps(original)
                  def traced(self):
                      start = time.monotonic_ns()
                      record("fit_enter", **geometry(self))
                      try:
                          return original(self)
                      finally:
                          record("fit_exit",
                                 ms_elapsed=round((time.monotonic_ns() - start) / 1_000_000, 3),
                                 **geometry(self))
                  return traced

              wrap(tk.Misc, "update_idletasks", update_factory)
              wrap(tk.Misc, "after_idle", after_idle_factory)
              wrap(tk.Misc, "after_cancel", after_cancel_factory)
              wrap(ParameterEditorWindow, "_bind_parameter_layout_events", bind_factory)
              wrap(ParameterEditorWindow, "_on_main_frame_resize", resize_event_factory)
              wrap(ParameterEditorWindow, "_run_pending_parameter_area_resize", pending_factory)
              wrap(ParameterEditorWindow, "_resize_parameter_area_to_fit", fit_factory)
              try:
                  yield
              finally:
                  pending("protocol_end")
                  record("test_end", omitted=omitted)
                  for (cls, name), original in originals.items():
                      setattr(cls, name, original)
                  originals.clear()
                  nodeid = None


          def phase_hook(name):
              @pytest.hookimpl(hookwrapper=True, tryfirst=True)
              def hook(item):
                  global phase
                  if item.nodeid not in selected_ids:
                      yield
                      return
                  phase = name
                  start = time.monotonic_ns()
                  record("phase_start")
                  outcome = yield
                  record("phase_end", ms_elapsed=round((time.monotonic_ns() - start) / 1_000_000, 3),
                         outcome=str(outcome.excinfo[0].__name__) if outcome.excinfo else "ok")
                  if name == "teardown":
                      pending("teardown_end")
              return hook


          pytest_runtest_setup = phase_hook("setup")
          pytest_runtest_call = phase_hook("call")
          pytest_runtest_teardown = phase_hook("teardown")
          PY_PLUGIN
          cat > "$RUNNER_TEMP/amc_tk_watchdog.py" <<'PY_WATCHDOG'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import time

          trace, done, output = map(Path, sys.argv[1:4])
          pid = int(sys.argv[4])
          sample = shutil.which('sample')
          (output / 'sample-availability.txt').write_text(f'sample utility: {sample}\n')
          offset = 0
          open_calls = []
          sampled = False
          while not done.exists():
              if trace.exists():
                  with trace.open(encoding='utf-8') as stream:
                      stream.seek(offset)
                      while True:
                          line = stream.readline()
                          if not line:
                              break
                          try:
                              row = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          event = row.get('event')
                          if event == 'update_enter':
                              open_calls.append((event, time.monotonic(), row))
                          elif event == 'update_exit':
                              match = 'update_enter'
                              for index in range(len(open_calls) - 1, -1, -1):
                                  if open_calls[index][0] == match:
                                      open_calls.pop(index)
                                      break
                      offset = stream.tell()
              now = time.monotonic()
              blocked = next((entry for entry in open_calls if now - entry[1] >= 10), None)
              if blocked and not sampled:
                  sampled = True
                  call = blocked[2]
                  (output / 'sample-trigger.json').write_text(json.dumps({
                      'pid': pid, 'observed_duration_s': round(now - blocked[1], 3),
                      'call': call, 'open_calls': [entry[2] for entry in open_calls]
                  }, indent=2))
                  if sample is None:
                      (output / 'sample-error.txt').write_text('macOS sample utility unavailable\n')
                  else:
                      try:
                          with (output / 'sample-command.log').open('w') as log:
                              result = subprocess.run(
                                  [sample, str(pid), '5', '-file', str(output / 'native-sample.txt')],
                                  stdout=log, stderr=subprocess.STDOUT, check=False, timeout=15,
                              )
                          (output / 'sample-exit.txt').write_text(f'sample exit: {result.returncode}\n')
                      except subprocess.TimeoutExpired:
                          (output / 'sample-error.txt').write_text('sample exceeded 15 seconds\n')
              time.sleep(0.2)
          (output / 'watchdog-finished.txt').write_text(
              f'sampled: {sampled}\nopen calls at finish: {len(open_calls)}\n'
          )
          PY_WATCHDOG
          command -v sample > "$diag/sample-availability-shell.txt" || true
          export PYTHONPATH="$RUNNER_TEMP${PYTHONPATH:+:$PYTHONPATH}"
          export AMC_TK_GEOMETRY_TRACE="$diag/geometry-trace.jsonl"
          export AMC_TK_SELECTED_IDS="$diag/selected-test-ids.txt"
          printf '%s\n' 'Normal collection; plugin validates and selects the 106-test contiguous GUI sequence.' > "$diag/selection-plan.txt"
          PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 "$VIRTUAL_ENV/bin/python" -m pytest \
            -p amc_tk_geometry_probe --timeout=30 --timeout-method=thread \
            -o "cache_dir=$RUNNER_TEMP/amc-tk-pytest-cache" -vv > "$diag/pytest.log" 2>&1 &
          pytest_pid=$!
          printf 'pytest PID: %s\n' "$pytest_pid" > "$diag/pytest-pid.txt"
          "$VIRTUAL_ENV/bin/python" "$RUNNER_TEMP/amc_tk_watchdog.py" \
            "$diag/geometry-trace.jsonl" "$diag/pytest-done" "$diag" "$pytest_pid" &
          watchdog_pid=$!
          set +e
          wait "$pytest_pid"
          status=$?
          set -e
          printf 'pytest exit: %s\n' "$status" > "$diag/pytest-exit.txt"
          touch "$diag/pytest-done"
          wait "$watchdog_pid"
          cat "$diag/pytest.log"
          exit "$status"

      - name: Upload Tk diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-python315-tk-original-order-gui-geometry
          path: ${{ runner.temp }}/amc-tk-diagnostic/
          if-no-files-found: warn
          retention-days: 3
