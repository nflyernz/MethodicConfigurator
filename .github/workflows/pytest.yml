name: Standalone macOS Tk showRootWindow fix comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build and compare pinned Tk variants
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/amc-uv-python
          UV_CACHE_DIR: ${{ runner.temp }}/amc-uv-cache
        run: bash diagnostics/tk_showroot_comparison.sh

      - name: Upload Tk build and crash evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tk-showroot-w1-w2
          path: ${{ runner.temp }}/amc-tk-showroot-comparison/
          if-no-files-found: warn
          retention-days: 3
